function tile(i,title,detail='',scene=''){return `<button class="tile" ${scene?`data-scene="${scene}"`:`data-panel="${title}"`}>${icon(i)}<span>${title}</span>${detail?`<small>${detail}</small>`:''}</button>`}
function row(i,title){return `<button class="small-row" data-panel="${title}">${icon(i)}${title}${icon('chevron','arrow')}</button>`}
function today(){return `${status()}<div class="scroll"><header class="head"><div class="top"><span class="brand">SUSTechMobile</span><button class="head-icon" data-panel="通知" aria-label="通知">${icon('bell')}</button></div><div class="hello"><h2>10月25日 周日</h2><span class="weather">${icon('sun')}26°</span></div><div class="sub"><span>第7教学周</span><i class="dot"></i><span>2026 秋季学期</span></div></header><div class="body"><div class="quick">${[['card','校园卡','card'],['bus','校车','bus'],['print','打印','printing'],['calendar','预约','reservations']].map(([i,n,s])=>`<button data-scene="${s}">${icon(i)}${n}</button>`).join('')}</div><div class="summary"><button data-scene="card"><span class="key">校园卡余额</span>${icon('card')}<div class="value"><small>¥</small>126.80</div><div class="hint">今天消费 ¥18.50</div></button><button data-scene="study"><span class="key">学习待办</span>${icon('file')}<div class="value">3<small> 项</small></div><div class="hint">今晚截止 1 项</div></button></div><div class="section-title"><h3>今天的安排</h3><button class="text-link" data-panel="我的日程">全部 ${icon('chevron')}</button></div><div class="agenda"><div class="agenda-row"><div class="agenda-time">17:00</div><div class="agenda-info"><strong>IC 研讨间</strong><p>201 · 图书馆 · 1小时</p></div><span class="pill">待使用</span></div><div class="agenda-row"><div class="agenda-time">19:00</div><div class="agenda-info"><strong>羽毛球</strong><p>松禾体育场 · 2号场</p></div><span class="pill">待使用</span></div></div><div class="section-title"><h3>即将截止</h3><button class="text-link" data-scene="study">Blackboard ${icon('chevron')}</button></div><div class="deadline"><span class="icon">${icon('file')}</span><div><strong>线性代数 · 作业3</strong><p>今晚 23:59</p></div><b>7小时</b></div></div></div>${nav('today')}`}
function reservations(){return `${status()}<div class="scroll">${header('预约中心')}<div class="body"><div class="counts"><div><strong>2</strong>项预约待使用</div><button data-panel="我的预约">我的预约 ${icon('chevron')}</button></div><section class="group"><div class="group-title">场地空间</div><div class="tile-grid">${tile('room','IC研讨间','图书馆')}${tile('building','书院场地','活动室 · 自习室')}</div></section><section class="group"><div class="group-title">运动与辅导</div><div class="tile-grid">${tile('sport','体育场馆','场地 · 时段')}${tile('chat','CLE辅导','语言中心')}</div></section><section class="bookings"><div class="section-title"><h3>今天的预约</h3></div><div class="booking">${icon('room')}<div><strong>IC研讨间 201</strong><p>17:00—18:00 · 图书馆</p></div><span class="tag">待使用</span></div><div class="booking">${icon('sport')}<div><strong>羽毛球 · 2号场</strong><p>19:00—20:00 · 松禾体育场</p></div><span class="tag">待使用</span></div></section></div></div>${nav('services')}`}
function generic(scene){let title,groups,extra='';if(scene==='services'){title='办事';groups=[['校园生活',[['card','校园卡','','card'],['bus','校园巴士','','bus'],['print','校园打印','','printing'],['calendar','预约中心','','reservations']]],['学习与资料',[['library','图书馆','','library'],['room','空教室'],['user','教师目录'],['grid','校园日历']]]]}else if(scene==='study'){title='学习';groups=[['教务',[['calendar','课表'],['file','考试'],['study','成绩'],['grid','学期课程']]],['Blackboard',[['study','我的课程'],['clock','作业截止'],['file','离线文件'],['calendar','我的日程']]]]}else if(scene==='printing'){title='校园打印';groups=[['打印',[['upload','导入PDF'],['print','任务队列'],['pin','打印站点'],['file','分享待打印']]],['记录',[['search','扫描任务'],['money','打印用量']]]]}else if(scene==='card'){title='校园卡';extra='<div class="counts"><div><span style="font-size:12px;color:#888">当前余额</span><br><strong>¥126.80</strong></div><button data-panel="账单">账单 '+icon('chevron')+'</button></div>';groups=[['账户服务',[['money','充值'],['file','账单'],['qr','校园码'],['user','身份码']]]]}else if(scene==='library'){title='图书馆';groups=[['我的图书馆',[['library','我的借阅'],['search','馆藏搜索'],['room','IC研讨间'],['user','馆内人数']]]]}else{title='我的';extra='<div class="counts"><div><strong style="font-size:20px">校园账号</strong><p style="font-size:11px;color:#888;margin-top:5px">教务 · Blackboard 已登录</p></div><button data-panel="学校账号">管理 '+icon('chevron')+'</button></div>';groups=[['偏好与工具',[['calendar','校历'],['bell','提醒'],['grid','小组件'],['info','关于']]]]};return `${status()}<div class="scroll">${header(title,!['services','study','account'].includes(scene))}<div class="body">${extra}${groups.map(([name,items])=>`<section class="group"><div class="group-title">${name}</div><div class="tile-grid">${items.map(x=>tile(...x)).join('')}</div></section>`).join('')}</div></div>${nav(['today','services','study','account'].includes(scene)?scene:'services')}`}
function mapArt(){return `<svg class="map-svg" viewBox="0 0 370 693" preserveAspectRatio="xMidYMid slice" aria-label="校园地图交互示意"><rect width="370" height="693" fill="#eff0e5"/><path d="M0 0h370v112l-52 12-70-28-50 35-82-23-61 23L0 94Z" fill="#dbe8ce"/><path d="m310 0-15 62 18 60 57 14V0Z" fill="#bfdce5"/><path d="M0 440 63 381l14 80-33 83-44 29Z" fill="#dbe8ce"/><g fill="#e4e3d9" stroke="#d6d7cb" stroke-width="1"><rect x="102" y="199" width="37" height="28" rx="4"/><rect x="146" y="188" width="40" height="34" rx="4"/><rect x="218" y="222" width="46" height="31" rx="4"/><rect x="94" y="330" width="42" height="39" rx="4"/><rect x="220" y="357" width="45" height="35" rx="4"/><rect x="189" y="435" width="38" height="26" rx="4"/><rect x="87" y="473" width="33" height="24" rx="4"/><rect x="251" y="470" width="49" height="30" rx="4"/><rect x="142" y="543" width="51" height="32" rx="4"/></g><g fill="none" stroke="#d3d5ca" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 576 76 524 122 420 95 302 132 250 225 251 294 311 265 414 208 520 76 524"/><path d="M132 250 158 145 239 110 251-10M95 302 16 270-20 280M294 311 390 315M122 420 265 414M208 520 290 615 390 652"/></g><g fill="none" stroke="#fffdf8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 576 76 524 122 420 95 302 132 250 225 251 294 311 265 414 208 520 76 524"/><path d="M132 250 158 145 239 110 251-10M95 302 16 270-20 280M294 311 390 315M122 420 265 414M208 520 290 615 390 652"/></g><path d="M132 247 92 302 119 420 73 521 206 517 262 412 291 312 223 247Z" fill="none" stroke="#16805d" stroke-width="3.2" opacity=".75"/><path d="M136 254 100 303 126 420 81 528 211 524 270 416 299 310 226 255Z" fill="none" stroke="#be5a87" stroke-width="3" opacity=".65"/><g font-family="sans-serif" font-size="10" fill="#8e9486" text-anchor="middle"><text x="176" y="179">图书馆</text><text x="239" y="279">行政楼</text><text x="126" y="392">第一教学楼</text><text x="249" y="450">松禾体育场</text><text x="99" y="554">二号门</text><text x="189" y="75">学生宿舍</text></g></svg><button class="marker stop" style="left:35.8%;top:36%" data-stop="图书馆" aria-label="图书馆站"> </button><button class="marker stop pink" style="left:37.4%;top:37.1%" data-stop="图书馆" aria-label="图书馆外环站"> </button><button class="marker stop" style="left:79%;top:45%" data-stop="行政楼" aria-label="行政楼站"> </button><button class="marker stop pink" style="left:81%;top:46.7%" data-stop="行政楼" aria-label="行政楼外环站"> </button><button class="marker stop" style="left:32%;top:60.5%" data-stop="第一教学楼" aria-label="第一教学楼站"> </button><button class="marker stop" style="left:21%;top:75.8%" data-stop="二号门" aria-label="二号门站"> </button><button class="marker bus" style="left:26%;top:44%" data-vehicle="cw" aria-label="1路内环校车">↻</button><button class="marker bus pink" style="left:73%;top:60%" data-vehicle="ccw" aria-label="2路外环校车">↺</button><button class="marker bus shuttle" style="left:48%;top:76%" data-vehicle="shuttle" aria-label="二号门区间">${icon('bus')}</button><div class="me" aria-label="我的位置"></div>`}
function bus(){return `${status()}<header class="head map-head"><div class="top"><button class="back" data-scene="services" aria-label="返回办事">${icon('back')}</button><h2>校园巴士</h2><button class="head-icon" data-panel="地图设置" aria-label="地图设置">${icon('grid')}</button></div></header><div class="map-screen"><div class="map-canvas"><div class="map-art">${mapArt()}</div></div><div class="nearest"><div class="eyebrow">${icon('pin')}附近站台</div><button class="near-row" data-stop="第一教学楼"><span class="direction">↻</span><span class="near-copy"><strong>第一教学楼</strong><small>1路 · 内环</small></span><span class="eta">3<small>分钟</small></span></button><button class="near-row" data-stop="第一教学楼"><span class="direction ccw">↺</span><span class="near-copy"><strong>第一教学楼</strong><small>2路 · 外环</small></span><span class="eta">8<small>分钟</small></span></button></div><button class="locate" aria-label="回到我的位置" data-locate>${icon('locate')}</button><div class="drawer"><button class="drag-head" aria-expanded="false" aria-label="展开发车时刻表"><div class="handle"></div><div class="drawer-heading">发车时刻表<span>今天 · 计划 ${icon('up')}</span></div></button><div class="filters" aria-label="时刻表线路筛选">${['全部','1路','2路','区间'].map((x,i)=>`<button class="${i?'':'active'}" data-filter="${x}">${x}</button>`).join('')}</div><div class="schedule-body"></div></div></div>`}
const scheduleGroups=[['1路 · 内环','↻',['15:40','16:00','16:20','16:40','17:00','17:20','17:40','18:00']],['2路 · 外环','↺',['15:45','16:05','16:25','16:45','17:05','17:25','17:45','18:05']],['二号门区间 · 上行','bus',['15:50','16:00','16:15','16:30']],['科研楼区间 · 下行','bus',['15:40','15:55','16:15','16:35']]];
function schedules(app,filter='全部'){app.querySelector('.schedule-body').innerHTML=scheduleGroups.filter(([n])=>filter==='全部'||(filter==='区间'?n.includes('区间'):n.startsWith(filter))).map(([n,i,t])=>`<div class="schedule-title">${i==='bus'?icon('bus'):`<span>${i}</span>`}${n}</div><div class="times">${t.map(time=>{const [h,m]=time.split(':').map(Number),delta=970-h*60-m;return `<div class="time ${delta>20?'past':delta>=0?'recent':''}">${time}</div>`}).join('')}</div>`).join('')}
function showFloat(app,type,name){const drawer=app.querySelector('.drawer');drawer.classList.remove('expanded');drawer.querySelector('.drag-head').setAttribute('aria-expanded','false');app.querySelector('.float-card')?.remove();const card=document.createElement('div');card.className='float-card';card.setAttribute('role','dialog');card.setAttribute('aria-label',type==='vehicle'?'车辆详情':'站台到站');let content;if(type==='vehicle'){const cw=name==='cw',sh=name==='shuttle';content=`<h3><span class="direction ${cw?'':'ccw'}">${sh?icon('bus'):cw?'↻':'↺'}</span>${sh?'二号门区间 · 上行':cw?'1路 · 内环':'2路 · 外环'}</h3><p class="next">下一站</p><div class="next-line"><strong>${sh?'二号门':cw?'第一教学楼':'行政楼'}</strong><span class="eta">${sh?'—':cw?'3':'5'}<small>${sh?'':'分钟'}</small></span></div>`}else{content=`<h3>${icon('pin')}${name}</h3>${[['↻','1路 · 内环',3],['↺','2路 · 外环',8],['bus','二号门区间 · 上行',12]].map(([i,n,t])=>`<div class="arrival-row"><span class="direction ${i==='↺'?'ccw':''}">${i==='bus'?icon('bus'):i}</span>${n}<span class="eta">${t}<small>分钟</small></span></div>`).join('')}`};card.innerHTML=`<button class="close" aria-label="关闭站台或车辆详情">${icon('close')}</button>${content}`;card.querySelector('.close').onclick=()=>card.remove();app.querySelector('.map-screen').append(card);if(app.querySelector('.drawer').classList.contains('expanded'))card.style.bottom='435px';}
function showPanel(app,title){app.querySelector('.detail-overlay')?.remove();const overlay=document.createElement('div');overlay.className='detail-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label',title);const contents=title==='我的预约'?`<div class="booking">${icon('room')}<div><strong>IC研讨间 201</strong><p>今天 17:00—18:00</p></div><span class="tag">待使用</span></div><div class="booking">${icon('sport')}<div><strong>羽毛球 · 2号场</strong><p>今天 19:00—20:00</p></div><span class="tag">待使用</span></div>`:title==='地图设置'?'<div class="small-row">国内底图对齐<span style="margin-left:auto;color:var(--strong)">已开启</span></div><div class="small-row">数据来源<span style="margin-left:auto">SUSTech CRA</span></div>':`<div class="small-row">${icon('clock')}今天 17:00—18:00</div><div class="small-row">${icon('pin')}选择地点${icon('chevron','arrow')}</div>`;overlay.innerHTML=`<section class="detail-panel"><button class="close" aria-label="关闭">${icon('close')}</button><h3>${title}</h3>${contents}<button class="confirm-button">完成</button></section>`;overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('.close,.confirm-button'))overlay.remove()});app.append(overlay);}
function draw(app,scene){app.dataset.scene=scene;app.innerHTML=(scene==='today'?today():scene==='reservations'?reservations():scene==='bus'?bus():generic(scene))+'<div class="home-indicator"></div>';if(scene==='bus'){schedules(app);wireMap(app)}app.onclick=e=>{const sceneButton=e.target.closest('button[data-scene]');if(sceneButton){draw(app,sceneButton.dataset.scene);return}const panel=e.target.closest('[data-panel]');if(panel){showPanel(app,panel.dataset.panel);return}const vehicle=e.target.closest('[data-vehicle]');if(vehicle){showFloat(app,'vehicle',vehicle.dataset.vehicle);return}const stop=e.target.closest('[data-stop]');if(stop){showFloat(app,'stop',stop.dataset.stop);return}const filter=e.target.closest('[data-filter]');if(filter){app.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===filter));schedules(app,filter.dataset.filter);return}if(e.target.closest('[data-locate]')){app.querySelector('.map-art').style.transform='translate(0,0)';app.querySelector('.float-card')?.remove();return}if(e.target.closest('.map-canvas')&&!app._panned)app.querySelector('.float-card')?.remove()};}
function wireMap(app){const drawer=app.querySelector('.drawer'),handle=app.querySelector('.drag-head');let startY;const expand=on=>{if(on)app.querySelector('.float-card')?.remove();drawer.classList.toggle('expanded',on);handle.setAttribute('aria-expanded',String(on));handle.setAttribute('aria-label',on?'收起发车时刻表':'展开发车时刻表');const card=app.querySelector('.float-card');if(card)card.style.bottom=on?'435px':'160px';};handle.onclick=()=>{if(!handle._dragged)expand(!drawer.classList.contains('expanded'));handle._dragged=false};handle.onpointerdown=e=>{startY=e.clientY;handle._dragged=false;handle.setPointerCapture(e.pointerId);drawer.style.transition='none'};handle.onpointermove=e=>{if(startY===undefined)return;const dy=e.clientY-startY;if(Math.abs(dy)>8){handle._dragged=true;const initial=drawer.classList.contains('expanded')?420:73;drawer.style.height=Math.max(73,Math.min(470,initial-dy))+'px'}};handle.onpointerup=e=>{if(startY===undefined)return;const dy=e.clientY-startY;drawer.style.transition='';drawer.style.height='';if(Math.abs(dy)>25)expand(dy<0);startY=undefined};handle.onpointercancel=()=>{drawer.style.transition='';drawer.style.height='';startY=undefined};const canvas=app.querySelector('.map-canvas'),art=app.querySelector('.map-art');let pointer;canvas.onpointerdown=e=>{if(e.target.closest('button'))return;pointer={x:e.clientX,y:e.clientY};app._panned=false;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!pointer)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.abs(dx)+Math.abs(dy)>7){app._panned=true;art.style.transform=`translate(${dx}px,${dy}px)`}};canvas.onpointerup=()=>{pointer=null;setTimeout(()=>app._panned=false,0)};canvas.onpointercancel=()=>pointer=null;}
const params=new URLSearchParams(location.search),single=params.get('scene');if(single)document.body.classList.add('solo');for(const scene of single?[single]:['today','reservations','bus']){const section=document.createElement('section');section.className='stage';const cap=captions[scene]||[scene,''];section.innerHTML=`<div class="caption"><strong>${cap[0]}</strong><span>${cap[1]}</span></div><div class="phone"><div class="app"></div></div>`;document.querySelector('#stages').append(section);draw(section.querySelector('.app'),scene)}
</script></body></html>
