name: Build iPhone and iPad IPA
on:
  workflow_dispatch:
    inputs:
      capture_screenshots:
        description: Capture simulator UI scenes (disable only when UI was already verified)
        required: false
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: ios-manual-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Verify generated project and fixtures
        run: python3 scripts/verify_repository.py
      - name: IPA packager tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Core parser and transport tests
        run: swift test
      - name: Build for iPhone and iPad simulator without signing
        run: >-
          xcodebuild -project SUSTech.xcodeproj -scheme SUSTech
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Build arm64 device app without an Apple account
        run: >-
          xcodebuild -project SUSTech.xcodeproj -scheme SUSTech
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData-device ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY='' build
      - name: Launch iPhone and iPad simulator smoke scenes
        if: ${{ inputs.capture_screenshots }}
        run: python3 scripts/simulator_smoke.py
      - name: Package IPA for local re-signing
        run: >-
          python3 scripts/package_ipa.py
          --app DerivedData-device/Build/Products/Release-iphoneos/SUSTech.app
          --output dist/SUSTechMobile-unsigned.ipa
          --commit "$GITHUB_SHA" --without-extensions
      - name: Package experimental share-extension build
        run: >-
          python3 scripts/package_ipa.py
          --app DerivedData-device/Build/Products/Release-iphoneos/SUSTech.app
          --output dist/SUSTechMobile-with-share-unsigned.ipa
          --commit "$GITHUB_SHA"
      - name: Include Windows installation guide
        run: |
          cp docs/WINDOWS_SIDELOAD.md dist/INSTALL-WINDOWS.md
          cp docs/RELEASE_0_3.md dist/RELEASE_0_3.md
          cp docs/RELEASE_0_3_1.md dist/RELEASE_0_3_1.md
          cp docs/RELEASE_0_4.md dist/RELEASE_0_4.md
          cp docs/WRITE_PROTOCOL_AUDIT_0_4.md dist/WRITE_PROTOCOL_AUDIT_0_4.md
          cp docs/RECHARGE_PAYMENT_RESEARCH.md dist/RECHARGE_PAYMENT_RESEARCH.md
      - name: Upload downloadable device package
        uses: actions/upload-artifact@v4
        with:
          name: SUSTech-iPhone-iPad-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Build summary
        run: |
          {
            echo '## iPhone / iPad test package'
            echo 'Download the artifact below, unzip it and select SUSTechMobile-unsigned.ipa in the Windows sideloading tool.'
            echo 'This is an unsigned arm64 device build. A Windows sideloading tool must re-sign it with your own Apple account.'
            echo 'No Apple credentials, signing certificates or school accounts were used by this workflow.'
            echo 'The simulator build is checked separately and is not included in the IPA.'
          } >> "$GITHUB_STEP_SUMMARY"
